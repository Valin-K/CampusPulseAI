# Pre-commit security testing across the repository.
# .NET security analyzers and NuGet auditing cover the production .NET application.
# Setup once per clone: pip install pre-commit detect-secrets, then run pre-commit install.
# Run every hook manually: pre-commit run --all-files
repos:
  # 1. Secret detection.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (all repository files)
        args: ["--baseline", ".secrets.baseline"]

  - repo: local
    hooks:
      # 2. Python source security checks across repository scripts.
      - id: python-security-rules
        name: Ruff security rules (all Python)
        entry: "ruff check --select S --per-file-ignores '*/tests/**/*.py:S101' ."
        language: python
        additional_dependencies: ["ruff==0.16.8"]
        pass_filenames: false
        files: \.py$

      # 3. Risky code patterns in .NET (Ruff security rules equivalent).
      - id: dotnet-security-analyzers
        name: .NET security analyzers (all projects)
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit/run-security-analyzers.ps1
        language: system
        pass_filenames: false
        files: \.(cs|razor|csproj|props|targets)$

      # 4. Known vulnerable NuGet dependencies.
      - id: nuget-vulnerable-packages
        name: NuGet vulnerable package audit (all projects)
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit/check-vulnerable-packages.ps1
        language: system
        pass_filenames: false
        files: \.(csproj|props|targets)$
