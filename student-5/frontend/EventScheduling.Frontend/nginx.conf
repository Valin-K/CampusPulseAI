server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Framework assets (.wasm/.dll/.json) must 404 if genuinely missing - never
    # fall through to index.html, which would corrupt the boot sequence.
    location /_framework/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep the shell uncached so a redeploy is picked up on the next refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
