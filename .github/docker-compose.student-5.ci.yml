services:
  academicrecords.backend:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mcp__Enabled: "false"
      Rag__Enabled: "false"

  academicrecords.database:
    ports: !override
      - "15521:8080"

  eventscheduling.backend:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mcp__Enabled: "false"
      Rag__Enabled: "false"
    ports: !override
      - "18085:8080"

  eventscheduling.frontend:
    ports: !override
      - "18086:80"
