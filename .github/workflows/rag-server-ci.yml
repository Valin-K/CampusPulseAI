name: Shared RAG Server CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-rag-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rag:
              - 'ai-services/rag-server/**'
              - 'shared/backend/CampusPulse.Shared.Ai*/**'
              - 'shared/backend/CampusPulse.Shared.Rag/**'
              - 'CampusPulseAI.slnx'
              - 'Directory.Packages.props'
              - '.github/workflows/rag-server-ci.yml'

      - name: No RAG changes
        if: github.event_name != 'workflow_dispatch' && steps.filter.outputs.rag != 'true'
        run: echo "No RAG changes detected."

      - name: Set up .NET
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.rag == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore RAG server
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.rag == 'true'
        run: dotnet restore ai-services/rag-server/RagServer/RagServer.csproj

      - name: Build RAG server
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.rag == 'true'
        run: dotnet build ai-services/rag-server/RagServer/RagServer.csproj --configuration Release --no-restore --nologo

      - name: Test RAG gateway integration
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.rag == 'true'
        run: dotnet test ai-services/rag-server/RagServer.Tests/RagServer.Tests.csproj --configuration Release --nologo

      - name: Build AI gateway
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.rag == 'true'
        run: dotnet build shared/backend/CampusPulse.Shared.Ai.Gateway/CampusPulse.Shared.Ai.Gateway.csproj --configuration Release --nologo

      # The keyless gateway explicitly enables RAG's local hashed embeddings.
      - name: Smoke test RAG endpoints
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.rag == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project shared/backend/CampusPulse.Shared.Ai.Gateway/CampusPulse.Shared.Ai.Gateway.csproj --configuration Release --no-build --no-launch-profile --urls http://localhost:5269 > ai-gateway.log 2>&1 &
          gateway_pid=$!
          trap 'kill $gateway_pid ${server_pid:-} 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://localhost:5269/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://localhost:5269/health | jq --exit-status '.service == "ai-gateway"'
          curl --silent --fail http://localhost:5269/api/ai/status | jq --exit-status '.generationAvailable == false'

          dotnet run --project ai-services/rag-server/RagServer/RagServer.csproj --configuration Release --no-build --no-launch-profile --urls http://localhost:5267 > rag-server.log 2>&1 &
          server_pid=$!

          for attempt in {1..20}; do
            if curl --silent --fail http://localhost:5267/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --silent --fail http://localhost:5267/health
          curl --silent --fail http://localhost:5267/api/rag/collections

          ingest=$(curl --silent --fail \
            -H "Content-Type: application/json" \
            -d '{"documents":[{"id":"ci-doc","text":"Course enrolment closes on 14 March each year. Late enrolment requires approval from the faculty office.","metadata":{"source":"ci"}}]}' \
            http://localhost:5267/api/rag/coursemanagement/documents)
          echo "$ingest"
          test "$(printf '%s' "$ingest" | jq --raw-output '.chunks')" -ge 1
          test "$(printf '%s' "$ingest" | jq --raw-output '.embedder')" = "hashed-bag-of-words"

          answer=$(curl --silent --fail \
            -H "Content-Type: application/json" \
            -d '{"question":"When does course enrolment close?","topK":2,"minimumConfidence":0}' \
            http://localhost:5267/api/rag/coursemanagement/answer)
          echo "$answer"
          test "$(printf '%s' "$answer" | jq --raw-output '.status')" = "generation_unavailable"
          test "$(printf '%s' "$answer" | jq --raw-output '.sources | length')" -ge 1
          test "$(printf '%s' "$answer" | jq --raw-output '.sources[0].documentId')" = "ci-doc"

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Content-Type: application/json" \
            -d '{"question":"anything"}' \
            http://localhost:5267/api/rag/not-a-collection/answer)
          test "$status" = "404"

          curl --silent --fail -X DELETE http://localhost:5267/api/rag/coursemanagement

      - name: Show server log on failure
        if: failure() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.rag == 'true')
        run: cat ai-gateway.log rag-server.log
