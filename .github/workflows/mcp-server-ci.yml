name: Shared MCP Server CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-mcp-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCP_ENABLED: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mcp:
              - 'ai-services/mcp-server/**'
              - 'CampusPulseAI.slnx'
              - 'Directory.Packages.props'
              - '.github/workflows/mcp-server-ci.yml'

      - name: No MCP changes
        if: github.event_name != 'workflow_dispatch' && steps.filter.outputs.mcp != 'true'
        run: echo "No MCP changes detected."

      - name: Set up .NET
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.mcp == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore MCP server
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.mcp == 'true'
        run: dotnet restore ai-services/mcp-server/McpServer/McpServer.csproj

      - name: Build MCP server
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.mcp == 'true'
        run: dotnet build ai-services/mcp-server/McpServer/McpServer.csproj --configuration Release --no-restore --nologo

      - name: Smoke test MCP endpoints
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.mcp == 'true'
        shell: bash
        run: |
          dotnet run --project ai-services/mcp-server/McpServer/McpServer.csproj --configuration Release --no-build --urls http://localhost:5268 > mcp-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://localhost:5268/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://localhost:5268/health
          tools=$(curl --silent --fail http://localhost:5268/api/mcp/tools)
          printf '%s' "$tools"
          printf '%s' "$tools" | grep --quiet 'calculate_student_academic_statistics'
          capabilities=$(curl --silent --fail \
            -H "Content-Type: application/json" \
            -d '{"tool":"get_feature_capabilities","arguments":{"feature":"student-1"}}' \
            http://localhost:5268/api/mcp/tools/call)
          printf '%s' "$capabilities"
          printf '%s' "$capabilities" | grep --quiet 'get_feature_capabilities'
          for feature in student-1 student-2 student-3 student-4 student-5; do
            integration=$(curl --silent --fail \
              -H "Content-Type: application/json" \
              -d "{\"tool\":\"validate_integration\",\"arguments\":{\"feature\":\"$feature\"}}" \
              http://localhost:5268/api/mcp/tools/call)
            printf '%s' "$integration"
            printf '%s' "$integration" | jq --exit-status '
              .result.valid == true
              and .result.missingTools == []
              and .result.unexpectedTools == []
              and .result.missingGlobalFeatureTools == []
              and all(.result.checks[]; .passed == true)
            ' > /dev/null
          done
          unsafe_path=$(curl --silent --fail \
            -H "Content-Type: application/json" \
            -d '{"tool":"project_files","arguments":{"directory_path":".."}}' \
            http://localhost:5268/api/mcp/tools/call)
          printf '%s' "$unsafe_path"
          printf '%s' "$unsafe_path" | grep --quiet '"isError":true'
          invalid_statistics_call=$(curl --silent --fail \
            -H "Content-Type: application/json" \
            -d '{"tool":"calculate_student_academic_statistics","arguments":{}}' \
            http://localhost:5268/api/mcp/tools/call)
          printf '%s' "$invalid_statistics_call"
          printf '%s' "$invalid_statistics_call" | grep --quiet '"isError":true'
          curl --silent --fail \
            -H "Content-Type: application/json" \
            -d '{"tool":"project_files","arguments":{"directory_path":"docs"}}' \
            http://localhost:5268/api/mcp/tools/call