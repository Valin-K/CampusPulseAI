name: Student 3 - Campus Housing CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

env:
  AI_MODE_ENABLED: "false"
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"

concurrency:
  group: student-3-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  student-3-validation:
    name: Student 3 validation
    runs-on: campuspulse-runners
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create ephemeral JWT signing key
        run: echo "CAMPUSPULSE_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            student3:
              - 'student-3/**'
              - 'shared/backend/CampusPulse.Shared.Ai*/**'
              - 'shared/backend/CampusPulse.Shared.Mcp/**'
              - 'shared/backend/CampusPulse.Shared.Rag/**'
              - 'docker-compose.yml'
              - '.github/docker-compose.student-3-ci.yml'
              - '.github/workflows/student-3.yml'

      - name: Setup .NET 10
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true'
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: 10.0.x

      - name: No Student 3 changes
        if: github.event_name != 'workflow_dispatch' && steps.filter.outputs.student3 != 'true'
        run: echo "No Student 3 changes detected."

      - name: Restore Student 3 projects
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true'
        run: |
          dotnet restore student-3/backend/CampusHousing.Backend/CampusHousing.Backend.csproj
          dotnet restore student-3/frontend/CampusHousing.Frontend/CampusHousing.Frontend.csproj
          dotnet restore student-3/database/CampusHousing.Database/CampusHousing.Database.csproj
          dotnet restore student-3/tests/CampusHousing.Tests/CampusHousing.Tests.csproj

      - name: Build backend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true'
        run: dotnet build student-3/backend/CampusHousing.Backend/CampusHousing.Backend.csproj --configuration Release --no-restore

      - name: Build frontend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true'
        run: dotnet build student-3/frontend/CampusHousing.Frontend/CampusHousing.Frontend.csproj --configuration Release --no-restore

      - name: Build database API
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true'
        run: dotnet build student-3/database/CampusHousing.Database/CampusHousing.Database.csproj --configuration Release --no-restore

      - name: Build test project
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true'
        run: dotnet build student-3/tests/CampusHousing.Tests/CampusHousing.Tests.csproj --configuration Release --no-restore

      - name: Run NUnit tests
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true'
        run: dotnet test student-3/tests/CampusHousing.Tests/CampusHousing.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=campus-housing-tests.trx" --results-directory TestResults

      - name: Upload NUnit test results
        if: always() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: student-3-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Validate and start Student 3 containers
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true'
        shell: bash
        run: |
          docker compose -f docker-compose.yml -f .github/docker-compose.student-3-ci.yml -p student-3-ci config --quiet
          docker compose -f docker-compose.yml -f .github/docker-compose.student-3-ci.yml -p student-3-ci build --with-dependencies ai.gateway academicrecords.database campushousing.database campushousing.backend campushousing.frontend
          docker compose -f docker-compose.yml -f .github/docker-compose.student-3-ci.yml -p student-3-ci up --detach --wait --no-build ai.gateway academicrecords.database campushousing.database campushousing.backend campushousing.frontend

      - name: Smoke test Student 3 containers
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true'
        shell: bash
        run: |
          set -euo pipefail

          endpoints=(
            "http://localhost:5269/health"
            "http://localhost:5083/health"
            "http://localhost:8083/"
          )

          for endpoint in "${endpoints[@]}"; do
            reachable=0
            for attempt in {1..30}; do
              if curl --silent --show-error --fail --max-time 5 "$endpoint" > /dev/null; then
                reachable=1
                break
              fi
              sleep 2
            done

            if [ "$reachable" -eq 0 ]; then
              echo "Container endpoint did not respond successfully: $endpoint"
              exit 1
            fi
          done

      - name: Show container diagnostics on failure
        if: failure() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true')
        shell: bash
        run: |
          docker compose -f docker-compose.yml -f .github/docker-compose.student-3-ci.yml -p student-3-ci ps
          docker compose -f docker-compose.yml -f .github/docker-compose.student-3-ci.yml -p student-3-ci logs --no-color ai.gateway academicrecords.database campushousing.database campushousing.backend campushousing.frontend

      - name: Remove Student 3 containers
        if: always() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true')
        shell: bash
        run: docker compose -f docker-compose.yml -f .github/docker-compose.student-3-ci.yml -p student-3-ci down --volumes --remove-orphans
