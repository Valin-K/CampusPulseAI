name: Student 4 - Financial Aid Billing CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"

concurrency:
  group: student-4-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test-and-smoke-test:
    name: Student 4 validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            student4:
              - 'student-4/**'
              - 'shared/backend/CampusPulse.Shared.Ai*/**'
              - 'docker-compose.yml'
              - '.github/docker-compose.student-4.ci.yml'
              - '.github/workflows/student-4-ci.yml'

      - name: No Student 4 changes
        if: github.event_name != 'workflow_dispatch' && steps.filter.outputs.student4 != 'true'
        run: echo "No Student 4 changes detected."

      - name: Restore Student 4 projects
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student4 == 'true'
        run: |
          dotnet restore student-4/backend/FinancialAidBilling.Backend/FinancialAidBilling.Backend.csproj
          dotnet restore student-4/frontend/FinancialAidBilling.Frontend/FinancialAidBilling.Frontend.csproj
          dotnet restore student-4/database/FinancialAidBilling.Database/FinancialAidBilling.Database.csproj
          dotnet restore student-4/tests/FinancialAidBilling.Tests/FinancialAidBilling.Tests.csproj

      - name: Build backend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student4 == 'true'
        run: dotnet build student-4/backend/FinancialAidBilling.Backend/FinancialAidBilling.Backend.csproj --configuration Release --no-restore

      - name: Build frontend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student4 == 'true'
        run: dotnet build student-4/frontend/FinancialAidBilling.Frontend/FinancialAidBilling.Frontend.csproj --configuration Release --no-restore

      - name: Build database API
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student4 == 'true'
        run: dotnet build student-4/database/FinancialAidBilling.Database/FinancialAidBilling.Database.csproj --configuration Release --no-restore

      - name: Run NUnit tests
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student4 == 'true'
        run: dotnet test student-4/tests/FinancialAidBilling.Tests/FinancialAidBilling.Tests.csproj --configuration Release --no-restore

      - name: Build and start Student 4 containers
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student4 == 'true'
        shell: bash
        run: |
          docker compose -p student-4-ci -f docker-compose.yml -f .github/docker-compose.student-4.ci.yml build --with-dependencies ai.gateway academicrecords.database academicrecords.backend financialaidbilling.database financialaidbilling.backend financialaidbilling.frontend
          docker compose -p student-4-ci -f docker-compose.yml -f .github/docker-compose.student-4.ci.yml up --detach --no-build ai.gateway academicrecords.database academicrecords.backend financialaidbilling.database financialaidbilling.backend financialaidbilling.frontend

      - name: Smoke test Student 4 containers
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student4 == 'true'
        shell: bash
        run: |
          authorization_header="Authorization: Bearer $(python3 .github/scripts/create-ci-auth-token.py)"
          endpoints=("http://localhost:5269/health" "http://localhost:18080/health" "http://localhost:18080/api/invoices" "http://localhost:18084/")
          for endpoint in "${endpoints[@]}"; do
            reachable=false
            for attempt in {1..30}; do
              if curl -s -f -m 5 --header "$authorization_header" "$endpoint" > /dev/null; then
                reachable=true
                break
              fi
              sleep 2
            done
            if [ "$reachable" = false ]; then
              docker compose -p student-4-ci -f docker-compose.yml -f .github/docker-compose.student-4.ci.yml ps
              docker compose -p student-4-ci -f docker-compose.yml -f .github/docker-compose.student-4.ci.yml logs --no-color ai.gateway financialaidbilling.database financialaidbilling.backend financialaidbilling.frontend
              echo "Container did not respond successfully: $endpoint"
              exit 1
            fi
          done
          curl -s -f -X POST http://localhost:18080/api/invoices -H "$authorization_header" -H 'Content-Type: application/json' -d '{"studentId":4,"description":"CI tuition fee","amount":1250.00,"issueDate":"2026-07-01","dueDate":"2026-08-01","status":0}' > /dev/null
          curl -s -f -X PUT http://localhost:18080/api/invoices/1 -H "$authorization_header" -H 'Content-Type: application/json' -d '{"studentId":4,"description":"Updated CI tuition fee","amount":4500.00,"issueDate":"2026-07-01","dueDate":"2026-08-15","status":1}' > /dev/null
          curl -s -f -X DELETE http://localhost:18080/api/invoices/2 -H "$authorization_header" > /dev/null

      - name: Remove Student 4 containers
        if: always() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.student4 == 'true')
        shell: bash
        run: docker compose -p student-4-ci -f docker-compose.yml -f .github/docker-compose.student-4.ci.yml down --volumes --remove-orphans