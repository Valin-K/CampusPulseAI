name: Student 5 - Event Scheduling CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"

concurrency:
  group: student-5-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test-and-smoke-test:
    name: Student 5 validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create ephemeral JWT signing key
        run: echo "CAMPUSPULSE_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            student5:
              - 'student-5/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/docker-compose.student-5.ci.yml'
              - '.github/workflows/student-5-ci.yml'
              - '.github/scripts/**'

      - name: No Student 5 changes
        if: github.event_name != 'workflow_dispatch' && steps.filter.outputs.student5 != 'true'
        run: echo "No Student 5 changes detected."

      - name: Restore Student 5 projects
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student5 == 'true'
        run: |
          dotnet restore student-5/backend/EventScheduling.Backend/EventScheduling.Backend.csproj
          dotnet restore student-5/frontend/EventScheduling.Frontend/EventScheduling.Frontend.csproj
          dotnet restore student-5/database/EventScheduling.Database/EventScheduling.Database.csproj
          dotnet restore student-5/tests/EventScheduling.Tests/EventScheduling.Tests.csproj

      - name: Build backend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student5 == 'true'
        run: dotnet build student-5/backend/EventScheduling.Backend/EventScheduling.Backend.csproj --configuration Release --no-restore

      - name: Build frontend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student5 == 'true'
        run: dotnet build student-5/frontend/EventScheduling.Frontend/EventScheduling.Frontend.csproj --configuration Release --no-restore

      - name: Build database API
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student5 == 'true'
        run: dotnet build student-5/database/EventScheduling.Database/EventScheduling.Database.csproj --configuration Release --no-restore

      - name: Build test project
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student5 == 'true'
        run: dotnet build student-5/tests/EventScheduling.Tests/EventScheduling.Tests.csproj --configuration Release --no-restore

      - name: Run NUnit tests
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student5 == 'true'
        run: dotnet test student-5/tests/EventScheduling.Tests/EventScheduling.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=event-scheduling-tests.trx" --results-directory TestResults

      - name: Build and start Student 5 containers
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student5 == 'true'
        shell: bash
        run: |
          docker compose -p student-5-ci -f docker-compose.yml -f .github/docker-compose.student-5.ci.yml build --with-dependencies ai.gateway academicrecords.database academicrecords.backend eventscheduling.database eventscheduling.backend eventscheduling.frontend
          docker compose -p student-5-ci -f docker-compose.yml -f .github/docker-compose.student-5.ci.yml up --detach --no-build ai.gateway academicrecords.database academicrecords.backend eventscheduling.database eventscheduling.backend eventscheduling.frontend

      # Smoke tests confirm container readiness; business endpoint assertions are a separate CI/CD step below.
      - name: Smoke test Student 5 container health
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student5 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          endpoints=("http://localhost:5269/health" "http://localhost:5020/health" "http://localhost:15521/health" "http://localhost:18085/health" "http://localhost:18086/")
          for endpoint in "${endpoints[@]}"; do
            reachable=false
            for attempt in {1..30}; do
              if curl --silent --show-error --fail --max-time 5 "$endpoint" > /dev/null; then
                reachable=true
                break
              fi
              sleep 2
            done
            if [ "$reachable" = false ]; then
              docker compose -p student-5-ci -f docker-compose.yml -f .github/docker-compose.student-5.ci.yml ps
              docker compose -p student-5-ci -f docker-compose.yml -f .github/docker-compose.student-5.ci.yml logs --no-color ai.gateway academicrecords.database academicrecords.backend eventscheduling.database eventscheduling.backend eventscheduling.frontend
              echo "Container did not respond successfully: $endpoint"
              exit 1
            fi
          done
      - name: Post-commit CI/CD lifecycle tests - Student 5
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student5 == 'true'
        run: python3 .github/scripts/run-post-commit-endpoint-tests.py --student 5 --base-url http://localhost:18085

      - name: Remove Student 5 containers
        if: always() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.student5 == 'true')
        shell: bash
        run: docker compose -p student-5-ci -f docker-compose.yml -f .github/docker-compose.student-5.ci.yml down --volumes --remove-orphans

      - name: Upload Student 5 post-commit CI/CD evidence
        if: always() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.student5 == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: student-5-post-commit-evidence
          path: |
            TestResults/*.trx
            reports/post-commit/student-5-*
          if-no-files-found: warn
          retention-days: 14
