name: Student 2 - Course Management CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"

concurrency:
  group: student-2-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test-and-smoke-test:
    name: Student 2 validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create ephemeral JWT signing key
        run: echo "CAMPUSPULSE_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            student2:
              - 'student-2/**'
              - 'shared/backend/CampusPulse.Shared.Ai*/**'
              - 'docker-compose.yml'
              - '.github/docker-compose.student-2.ci.yml'
              - '.github/workflows/student-2-ci.yml'
              - '.github/scripts/**'

      - name: No Student 2 changes
        if: github.event_name != 'workflow_dispatch' && steps.filter.outputs.student2 != 'true'
        run: echo "No Student 2 changes detected."

      - name: Restore Student 2 projects
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student2 == 'true'
        run: |
          dotnet restore student-2/backend/CourseManagement.Backend/CourseManagement.Backend.csproj
          dotnet restore student-2/frontend/CourseManagement.Frontend/CourseManagement.Frontend.csproj
          dotnet restore student-2/database/CourseManagement.Database/CourseManagement.Database.csproj
          dotnet restore student-2/tests/CourseManagement.Tests/CourseManagement.Tests.csproj

      - name: Build backend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student2 == 'true'
        run: dotnet build student-2/backend/CourseManagement.Backend/CourseManagement.Backend.csproj --configuration Release --no-restore

      - name: Build frontend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student2 == 'true'
        run: dotnet build student-2/frontend/CourseManagement.Frontend/CourseManagement.Frontend.csproj --configuration Release --no-restore

      - name: Build database API
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student2 == 'true'
        run: dotnet build student-2/database/CourseManagement.Database/CourseManagement.Database.csproj --configuration Release --no-restore

      - name: Run NUnit tests
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student2 == 'true'
        run: dotnet test student-2/tests/CourseManagement.Tests/CourseManagement.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=course-management-tests.trx" --results-directory TestResults

      - name: Build and start Student 2 containers
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student2 == 'true'
        shell: bash
        run: |
          cp .github/student-2-ci-appsettings.json student-2/frontend/CourseManagement.Frontend/wwwroot/appsettings.json
          docker compose -p student-2-ci -f docker-compose.yml -f .github/docker-compose.student-2.ci.yml build --with-dependencies ai.gateway academicrecords.database academicrecords.backend coursemanagement.database coursemanagement.backend coursemanagement.frontend
          docker compose -p student-2-ci -f docker-compose.yml -f .github/docker-compose.student-2.ci.yml up --detach --no-build ai.gateway academicrecords.database academicrecords.backend coursemanagement.database coursemanagement.backend coursemanagement.frontend

      # Smoke tests confirm container readiness; business endpoint assertions are a separate CI/CD step below.
      - name: Smoke test Student 2 container health
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student2 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(
            "http://localhost:5269/health"
            "http://localhost:5020/health"
            "http://localhost:15021/health"
            "http://localhost:15118/health"
            "http://localhost:15120/health"
            "http://localhost:18082/"
          )

          for endpoint in "${endpoints[@]}"; do
            reachable=false
            for attempt in {1..30}; do
              if curl --silent --show-error --fail --max-time 5 "$endpoint" > /dev/null; then
                reachable=true
                break
              fi
              sleep 2
            done

            if [ "$reachable" = false ]; then
              echo "Container did not respond successfully: $endpoint"
              exit 1
            fi
          done

      - name: Post-commit CI/CD tests (two endpoints) - Student 2
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student2 == 'true'
        run: python3 .github/scripts/run-post-commit-endpoint-tests.py --student 2 --base-url http://localhost:15118

      - name: Display Student 2 container diagnostics
        if: failure() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.student2 == 'true')
        shell: bash
        run: |
          docker compose -p student-2-ci -f docker-compose.yml -f .github/docker-compose.student-2.ci.yml ps
          docker compose -p student-2-ci -f docker-compose.yml -f .github/docker-compose.student-2.ci.yml logs --no-color ai.gateway academicrecords.database academicrecords.backend coursemanagement.database coursemanagement.backend coursemanagement.frontend

      - name: Remove Student 2 containers
        if: always() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.student2 == 'true')
        shell: bash
        run: docker compose -p student-2-ci -f docker-compose.yml -f .github/docker-compose.student-2.ci.yml down --volumes --remove-orphans

      - name: Upload Student 2 post-commit CI/CD evidence
        if: always() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.student2 == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: student-2-post-commit-evidence
          path: |
            TestResults/*.trx
            reports/post-commit/student-2-*
          if-no-files-found: warn
          retention-days: 14
