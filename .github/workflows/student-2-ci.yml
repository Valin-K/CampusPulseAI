name: Student 2 - Course Management CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detect-student-2-changes:
    name: Detect Student 2 changes
    runs-on: campuspulse-runners
    outputs:
      student2: ${{ steps.filter.outputs.student2 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            student2:
              - 'student-2/**'

  student-2-validation:
    name: Student 2 validation
    runs-on: campuspulse-runners
    needs: detect-student-2-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-student-2-changes.outputs.student2 == 'true'

    steps:
      - name: Placeholder validation
        run: echo "Student 2 validation is not implemented yet."