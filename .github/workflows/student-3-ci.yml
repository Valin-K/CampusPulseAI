name: Student 3 - Campus Housing CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  student-3-validation:
    name: Student 3 validation
    runs-on: campuspulse-runners

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            student3:
              - 'student-3/**'

      - name: Placeholder validation
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.student3 == 'true'
        run: echo "Student 3 validation is not implemented yet."