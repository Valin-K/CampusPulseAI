services:
  academicrecords.database:
    ports: !override
      - "15021:8080"

  coursemanagement.database:
    ports: !override
      - "15120:8080"

  coursemanagement.backend:
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Cors__AllowedOrigins__0: http://localhost:18082
    ports: !override
      - "15118:8080"

  coursemanagement.frontend:
    ports: !override
      - "18082:80"
    volumes:
      - ./.github/student-2-ci-appsettings.json:/usr/share/nginx/html/appsettings.json:ro
