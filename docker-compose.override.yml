services:
  academicrecords.database:
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || grep -a -q DistrolessHelper /proc/1/cmdline"]

  academicrecords.backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "5020:8080"

  coursemanagement.backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "5118:8080"
    volumes:
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  campushousing.backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - Services__CampusHousingDatabase=http://campushousing.database:8080
    ports:
      - "5083:8080"

  campushousing.database:
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || grep -a -q DistrolessHelper /proc/1/cmdline"]


  financialaidbilling.backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080"

  eventscheduling.backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080"

# MCP runs locally outside Docker Compose.
x-local-ai-boundary: true







