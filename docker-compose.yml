services:
  academicrecords.database:
    image: ${DOCKER_REGISTRY-}academicrecords.database
    build:
      context: .
      dockerfile: student-1/database/AcademicRecords.Database/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__AcademicRecords: Data Source=/app/data/academic-records.db
    ports:
      - "5021:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  academicrecords.backend:
    image: ${DOCKER_REGISTRY-}academicrecordsbackend
    build:
      context: .
      dockerfile: student-1/backend/AcademicRecords.Backend/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Services__AcademicRecordsDatabase: http://academicrecords.database:8080
      Services__CourseManagementDatabase: http://coursemanagement.database:8080
      Services__McpServer: http://host.docker.internal:5268
      Services__RagServer: http://host.docker.internal:5267
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "5020:8080"
    depends_on:
      - academicrecords.database

  coursemanagement.backend:
    image: ${DOCKER_REGISTRY-}coursemanagementbackend
    build:
      context: .
      dockerfile: student-2/backend/CourseManagement.Backend/Dockerfile
    environment:
      - Services__AcademicRecordsDatabase=http://academicrecords.database:8080
      - Services__CourseManagementDatabase=http://coursemanagement.database:8080
      - Services__McpServer=http://host.docker.internal:5268
      - Services__RagServer=http://host.docker.internal:5267
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - academicrecords.database
      - coursemanagement.database

  coursemanagement.database:
    image: ${DOCKER_REGISTRY-}coursemanagement.database
    build:
      context: .
      dockerfile: student-2/database/CourseManagement.Database/Dockerfile
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__CourseManagementDatabase=Data Source=/app/data/course-management.db;Foreign Keys=True
      - SyllabusStorage__RootPath=/app/data/syllabi
    ports:
      - "5120:8080"
    volumes:
      - coursemanagement-data:/app/data

  campushousing.backend:
    image: ${DOCKER_REGISTRY-}campushousingbackend
    build:
      context: .
      dockerfile: student-3/backend/CampusHousing.Backend/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Services__CampusHousingDatabase: http://campushousing.database:8080
      Services__AcademicRecordsDatabase: http://academicrecords.database:8080
      Services__McpServer: http://host.docker.internal:5268
      Services__RagServer: http://host.docker.internal:5267
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "5083:8080"
    depends_on:
      campushousing.database:
        condition: service_healthy
      academicrecords.database:
        condition: service_healthy

  campushousing.database:
    image: ${DOCKER_REGISTRY-}campushousingdatabase
    build:
      context: .
      dockerfile: student-3/database/CampusHousing.Database/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__CampusHousing: Data Source=/app/data/campus-housing.db
      Services__AcademicRecordsDatabase: http://academicrecords.database:8080
    volumes:
      - campushousing-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s


  financialaidbilling.backend:
    image: ${DOCKER_REGISTRY-}financialaidbillingbackend
    build:
      context: .
      dockerfile: student-4/backend/FinancialAidBilling.Backend/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Services__InvoiceDatabase: http://financialaidbilling.database:8080
      Services__AcademicRecordsBackend: http://academicrecords.backend:8080
      Services__McpServer: http://host.docker.internal:5268
      Services__RagServer: http://host.docker.internal:5267
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8089:8080"
    depends_on:
      financialaidbilling.database:
        condition: service_started
      academicrecords.backend:
        condition: service_started

  financialaidbilling.database:
    image: ${DOCKER_REGISTRY-}financialaidbillingdatabase
    build:
      context: .
      dockerfile: student-4/database/FinancialAidBilling.Database/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__FinancialAidBilling: Data Source=/app/data/financial-aid-billing.db


  eventscheduling.backend:
    image: ${DOCKER_REGISTRY-}eventschedulingbackend
    build:
      context: .
      dockerfile: student-5/backend/EventScheduling.Backend/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Services__EventDatabase: http://eventscheduling.database:8080
      Services__AcademicRecordsDatabase: http://academicrecords.database:8080
      Services__McpServer: http://host.docker.internal:5268
      Services__RagServer: http://host.docker.internal:5267
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8090:8080"
    depends_on:
      eventscheduling.database:
        condition: service_started
      academicrecords.database:
        condition: service_started

  eventscheduling.database:
    image: ${DOCKER_REGISTRY-}eventschedulingdatabase
    build:
      context: .
      dockerfile: student-5/database/EventScheduling.Database/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__EventScheduling: Data Source=/app/data/event-scheduling.db


  academicrecords.frontend:
    image: ${DOCKER_REGISTRY-}academicrecordsfrontend
    build:
      context: .
      dockerfile: docker/frontend/AcademicRecords.Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - academicrecords.backend


  coursemanagement.frontend:
    image: ${DOCKER_REGISTRY-}coursemanagementfrontend
    build:
      context: .
      dockerfile: student-2/frontend/CourseManagement.Frontend/Dockerfile
    depends_on:
      - coursemanagement.backend
    ports:
      - "8082:80"


  campushousing.frontend:
    image: ${DOCKER_REGISTRY-}campushousingfrontend
    build:
      context: .
      dockerfile: docker/frontend/CampusHousing.Dockerfile
    ports:
      - "8083:80"
    depends_on:
      - campushousing.backend


  financialaidbilling.frontend:
    image: ${DOCKER_REGISTRY-}financialaidbillingfrontend
    build:
      context: .
      dockerfile: docker/frontend/FinancialAidBilling.Dockerfile
    ports:
      - "8084:80"
    depends_on:
      financialaidbilling.backend:
        condition: service_started


  eventscheduling.frontend:
    image: ${DOCKER_REGISTRY-}eventschedulingfrontend
    build:
      context: .
      dockerfile: docker/frontend/EventScheduling.Dockerfile
    ports:
      - "8085:80"
    depends_on:
      eventscheduling.backend:
        condition: service_started

  shared-ui:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./shared/frontend:/usr/share/nginx/html:ro

volumes:
  coursemanagement-data:
  campushousing-data:
