services:
  academicrecords.backend:
    image: ${DOCKER_REGISTRY-}academicrecordsbackend
    build:
      context: .
      dockerfile: student-1/backend/AcademicRecords.Backend/Dockerfile

  coursemanagement.backend:
    image: ${DOCKER_REGISTRY-}coursemanagementbackend
    build:
      context: .
      dockerfile: student-2/backend/CourseManagement.Backend/Dockerfile


  campushousing.backend:
    image: ${DOCKER_REGISTRY-}campushousingbackend
    build:
      context: .
      dockerfile: student-3/backend/CampusHousing.Backend/Dockerfile


  financialaidbilling.backend:
    image: ${DOCKER_REGISTRY-}financialaidbillingbackend
    build:
      context: .
      dockerfile: student-4/backend/FinancialAidBilling.Backend/Dockerfile


  eventscheduling.backend:
    image: ${DOCKER_REGISTRY-}eventschedulingbackend
    build:
      context: .
      dockerfile: student-5/backend/EventScheduling.Backend/Dockerfile


  mcpserver:
    image: ${DOCKER_REGISTRY-}mcpserver
    build:
      context: .
      dockerfile: ai-services/mcp-server/McpServer/Dockerfile


  multiagentserver:
    image: ${DOCKER_REGISTRY-}multiagentserver
    build:
      context: .
      dockerfile: ai-services/multi-agent-server/MultiAgentServer/Dockerfile


  ragserver:
    image: ${DOCKER_REGISTRY-}ragserver
    build:
      context: .
      dockerfile: ai-services/rag-server/RagServer/Dockerfile


  academicrecords.frontend:
    image: ${DOCKER_REGISTRY-}academicrecordsfrontend
    build:
      context: .
      dockerfile: docker/frontend/AcademicRecords.Dockerfile
    ports:
      - "8081:80"


  coursemanagement.frontend:
    image: ${DOCKER_REGISTRY-}coursemanagementfrontend
    build:
      context: .
      dockerfile: student-2/frontend/CourseManagement.Frontend/Dockerfile
    depends_on:
      - coursemanagement.backend
    ports:
      - "8082:80"


  campushousing.frontend:
    image: ${DOCKER_REGISTRY-}campushousingfrontend
    build:
      context: .
      dockerfile: docker/frontend/CampusHousing.Dockerfile
    ports:
      - "8083:80"


  financialaidbilling.frontend:
    image: ${DOCKER_REGISTRY-}financialaidbillingfrontend
    build:
      context: .
      dockerfile: docker/frontend/FinancialAidBilling.Dockerfile
    ports:
      - "8084:80"


  eventscheduling.frontend:
    image: ${DOCKER_REGISTRY-}eventschedulingfrontend
    build:
      context: .
      dockerfile: docker/frontend/EventScheduling.Dockerfile
    ports:
      - "8085:80"

  shared-ui:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./shared/frontend:/usr/share/nginx/html:ro
